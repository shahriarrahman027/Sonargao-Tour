    <meta charset="UTF-8" />

    <meta name="theme-color" content="#14452F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="সস্তায় ট্যুর" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tour_theme');
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="সস্তায় ১ দিনের ট্যুর (Sostay 1 diner tour) — প্ল্যান ক্যানসেল না হইলেই হয়। Savar to Sonargaon & Puran Dhaka private group travel headquarters."
    />
    <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
    <link rel="apple-touch-icon" href="/images/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>সস্তায় ১ দিনের ট্যুর — Sostay 1 diner tour</title>
